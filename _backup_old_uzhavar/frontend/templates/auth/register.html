{% extends 'base.html' %}

{% block title %}Register – {{ t('app_name') }}{% endblock %}

{% block content %}
<div style="max-width: 640px; margin: 20px auto;">
    <div class="card">
        <div class="card-header" style="text-align: center; display: block; padding: 24px 20px 16px;">
            <div style="font-size: 2.2rem; margin-bottom: 6px;">🌱</div>
            <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-900);">Join the {{ t('app_name') }} Family</h2>
            <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">
                Earn <strong>50 Bonus Reward Points</strong> immediately on registration!
            </p>
        </div>

        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <!-- Role Selector -->
                <div class="form-group">
                    <label class="form-label">I am joining as a:</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <label style="border: 2px solid var(--primary-600); background: var(--primary-50); padding: 12px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 10px;">
                            <input type="radio" name="role" value="farmer" checked onchange="toggleRoleFields('farmer')">
                            <div>
                                <div style="font-weight: 700; color: var(--primary-900);">🚜 {{ t('farmer') }}</div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">List & sell crops directly</div>
                            </div>
                        </label>

                        <label style="border: 2px solid var(--border-color); padding: 12px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 10px;">
                            <input type="radio" name="role" value="buyer" onchange="toggleRoleFields('buyer')">
                            <div>
                                <div style="font-weight: 700; color: var(--primary-900);">🛒 {{ t('buyer') }} / Trader</div>
                                <div style="font-size: 0.75rem; color: var(--text-secondary);">Source produce at mandi rates</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Mobile Number *</label>
                        <input type="tel" name="mobile" class="form-control" placeholder="10-digit mobile number" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email Address (Optional)</label>
                        <input type="email" name="email" class="form-control" placeholder="name@domain.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                    </div>
                </div>

                <!-- Location Fields -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">State *</label>
                        <select name="state" class="form-control" required>
                            <option value="">Select State</option>
                            <option value="Tamil Nadu" selected>Tamil Nadu</option>
                            <option value="Andhra Pradesh">Andhra Pradesh</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Kerala">Kerala</option>
                            <option value="Telangana">Telangana</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="Gujarat">Gujarat</option>
                            <option value="Punjab">Punjab</option>
                            <option value="Haryana">Haryana</option>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Madhya Pradesh">Madhya Pradesh</option>
                            <option value="West Bengal">West Bengal</option>
                            <option value="Rajasthan">Rajasthan</option>
                            <option value="Bihar">Bihar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">District *</label>
                        <input type="text" name="district" class="form-control" placeholder="e.g. Thanjavur / Nashik" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Village / Town / Locality</label>
                        <input type="text" name="village" class="form-control" placeholder="e.g. Thiruvaiyaru">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Preferred Regional Language</label>
                        <select name="preferred_language" class="form-control">
                            {% for code, lang_info in languages.items() %}
                            <option value="{{ code }}" {% if current_lang == code %}selected{% endif %}>
                                {{ lang_info.flag }} {{ lang_info.native }} ({{ lang_info.name }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Farmer Specific Fields -->
                <div id="farmerFields">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Farm Land Size (in Acres)</label>
                            <input type="number" step="0.1" name="farm_size_acres" class="form-control" placeholder="e.g. 5.5">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Primary Crops Grown</label>
                            <input type="text" name="primary_crops" class="form-control" placeholder="e.g. Paddy, Groundnut, Sugarcane">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Farmer UPI ID (for direct payments)</label>
                        <input type="text" name="upi_id" class="form-control" placeholder="e.g. farmer@upi">
                    </div>
                </div>

                <!-- Buyer Specific Fields -->
                <div id="buyerFields" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Business / Wholesale Name</label>
                        <input type="text" name="business_name" class="form-control" placeholder="e.g. Annapoorna Traders">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Delivery Address</label>
                        <textarea name="delivery_address" class="form-control" rows="2" placeholder="Full warehouse or shop address"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Complete Registration (+50 Points) &rarr;
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                Already registered? <a href="{{ url_for('auth.login') }}" style="font-weight: 700;">Login here</a>
            </div>
        </div>
    </div>
</div>

<script>
function toggleRoleFields(role) {
    const farmerDiv = document.getElementById('farmerFields');
    const buyerDiv = document.getElementById('buyerFields');
    if (role === 'farmer') {
        farmerDiv.style.display = 'block';
        buyerDiv.style.display = 'none';
    } else {
        farmerDiv.style.display = 'none';
        buyerDiv.style.display = 'block';
    }
}
</script>
{% endblock %}
