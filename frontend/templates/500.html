{% extends 'base.html' %}

{% block title %}Server Error – {{ t('app_name') }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 12px;">⚠️</div>
    <h1 style="font-size: 2.2rem; font-weight: 800; color: #dc2626; margin-bottom: 8px;">500 - Server Error</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">
        An unexpected error occurred while processing your request. Please try again shortly.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
        Return to Home Page &rarr;
    </a>
</div>
{% endblock %}
