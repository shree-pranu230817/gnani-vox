{% extends 'base.html' %}

{% block title %}Page Not Found – {{ t('app_name') }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 12px;">🌾</div>
    <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--primary-900); margin-bottom: 8px;">404 - Page Not Found</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">
        The harvest field or page you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
        Return to Home Page &rarr;
    </a>
</div>
{% endblock %}
